name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go Test (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: complik
            path: complik
          - module: procscan
            path: procscan
          - module: admin
            path: sealos-complik-admin

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.sum
            go.work.sum
            complik/go.sum
            procscan/go.sum
            sealos-complik-admin/go.sum

      - name: Test
        working-directory: ${{ matrix.path }}
        run: go test -v -timeout 5m -count=1 ./...

  go-lint:
    name: Go Lint (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: complik
            path: complik
          - module: procscan
            path: procscan
          - module: admin
            path: sealos-complik-admin

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.sum
            go.work.sum
            complik/go.sum
            procscan/go.sum
            sealos-complik-admin/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6
        with:
          version: v2.11.3
          working-directory: ${{ matrix.path }}
          args: --color=always

  admin-web-build:
    name: Admin Web Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sealos-complik-admin/web/package-lock.json

      - name: Install Dependencies
        working-directory: sealos-complik-admin/web
        run: npm ci

      - name: Build
        working-directory: sealos-complik-admin/web
        run: npm run build
